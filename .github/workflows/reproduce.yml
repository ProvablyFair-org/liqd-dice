# Second-machine reproduction (Framework 1.0 release bar, F12).
# A clean ubuntu-latest runner installs from the lockfile with the runtime pinned in .nvmrc and runs
# npm test, which scores the committed artifacts, writes only to outputs/run/, and ends with
# `release-manifest.mjs --check` (the release bar). The runtime and the result are written to the
# job summary. It then runs `npm run test:standalone` (the committed zero-install bundles), and the
# job fails if either changed any tracked file.
name: reproduce
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: npm test
        run: |
          start=$(date +%s)
          set +e; npm test; rc=$?; set -e
          secs=$(( $(date +%s) - start ))
          {
            echo "| runner | node | npm test exit | seconds | cores |"
            echo "|---|---|---|---|---|"
            echo "| ubuntu-latest ($(lsb_release -ds 2>/dev/null || uname -sr)) | $(node --version) | $rc | $secs | $(nproc) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # The zero-install path (the README's first two commands). It runs the committed bundles
      # verify.js / test.js, so a bundle left stale after a source change fails here even though
      # npm test (which runs the TypeScript) is green.
      - name: npm run test:standalone
        run: npm run test:standalone
      - name: tracked files untouched by npm test
        run: git diff --exit-code --stat
